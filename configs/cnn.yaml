# 1D-CNN baseline (Milestone 3)
run_name: cnn
model: cnn
model_args:
  dropout: 0.3

seed: 42
batch_size: 64
epochs: 50          # maximum; early stopping usually ends sooner
patience: 8         # stop after 8 epochs without a better val macro AUROC
lr: 0.001
weight_decay: 0.01
use_pos_weight: false   # true = weight rare classes more in the loss
warmup_epochs: 0
cosine_decay: false
grad_clip: 0            # 0 = no gradient clipping
