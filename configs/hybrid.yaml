# Hybrid CNN + Transformer (Milestone 5)
run_name: hybrid
model: hybrid
model_args:
  d_model: 128
  n_heads: 4
  n_layers: 4
  mlp_dim: 256
  dropout: 0.1

seed: 42
batch_size: 64
epochs: 50
patience: 8
lr: 0.0003
weight_decay: 0.05
use_pos_weight: false
warmup_epochs: 5
cosine_decay: true
grad_clip: 1.0
