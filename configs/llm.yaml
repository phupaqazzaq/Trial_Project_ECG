# LLM report settings (Milestone 7)
run: hybrid               # which trained model to explain (must have attention)

# provider: who writes the report
#   qwen       free Qwen model running on this computer (no account, no API key)
#   anthropic  Claude API; the key is read from the ANTHROPIC_API_KEY environment variable
#   template   fixed sentences, no LLM
provider: qwen
model: Qwen/Qwen2.5-1.5B-Instruct   # Hugging Face model name, downloaded once (about 3 GB)

# To use Claude instead, set:
#   provider: anthropic
#   model: claude-opus-5-5
